name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: build (zero errors; VitePress fails on dead router links)
        run: npm run docs:build

      - name: dead links + missing assets
        # github.com is excluded by default (engine repo private);
        # re-enable at public release — see scripts/check-links.mjs.
        run: npm run check:links

      - name: CLI docs ↔ captured snapshots consistency
        run: npm run check:cli

      - name: upload site artifact (preview per-PR)
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: .vitepress/dist
